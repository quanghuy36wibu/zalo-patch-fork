name: Verify Zalo Patch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" > tikgoon.b64
          base64 -d tikgoon.b64 > tikgoon.jks
          echo "SIGNING_KEYSTORE_FILE=${{ github.workspace }}/tikgoon.jks" >> $GITHUB_ENV

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Test and assemble
        env:
          SIGNING_KEYSTORE_FILE: ${{ env.SIGNING_KEYSTORE_FILE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: tikgoon
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleRelease
          --console=plain

      - name: Upload signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zalo-patch-signed-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
